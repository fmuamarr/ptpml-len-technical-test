services:
  postgres:
    image: postgres:16-alpine
    container_name: db_len_tech_test_muamar
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: lentechtest
      POSTGRES_DB: geo_entities
    ports:
      - "5432:5432"          # also exposed to host so `go run` on localhost still connects
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
    networks:
      - geo_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d geo_entities"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: api_len_tech_test_muamar
    restart: unless-stopped
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://postgres:lentechtest@postgres:5432/geo_entities?sslmode=disable"
    ports:
      - "8080:8080"
    networks:
      - geo_net
    depends_on:
      postgres:
        condition: service_healthy

networks:
  geo_net:
    driver: bridge

volumes:
  pgdata:
